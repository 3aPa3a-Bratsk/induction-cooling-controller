; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-c6-devkitm-1]
platform = espressif32
board = esp32-c6-devkitm-1
framework = espidf
monitor_speed = 115200

board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.flash_mode = dio
board_build.f_cpu = 160000000L

upload_port = COM3
upload_speed = 921600

; Убираем проблемные флаги
build_flags = 
    -DESP32C6
    -DCONFIG_ESP32C6_DEFAULT_CPU_FREQ_MHZ=160
    -DCONFIG_ESP_TIMER_ISR_AFFINE=1
    -DCONFIG_ESP_MAIN_TASK_STACK_SIZE=16384
    -DCONFIG_ESP_TASK_WDT_TIMEOUT_S=10
    -DCONFIG_OPTIMIZATION_ASSERTIONS_ENABLED=y
    -DCONFIG_COMPILER_STACK_CHECK_MODE=STRONG
    -DCONFIG_ESP_ERR_TO_NAME_LOOKUP=y
    -DCONFIG_ESPTOOLPY_FLASHSIZE_4MB=y
    -DCONFIG_ESPTOOLPY_FLASHMODE_DIO=y
    -DCONFIG_ESPTOOLPY_FLASHFREQ_80M=y
    -DCONFIG_LOG_DEFAULT_LEVEL=DEBUG
    -DCONFIG_LOG_MAXIMUM_LEVEL=5
    -DCONFIG_I2C_SUPPRESS_DEPRECATE_WARN=y
    -Wno-format-truncation
    -Wno-volatile
    -Wno-error=volatile
    -Wno-error=old-style-declaration

debug_build_flags = 
    -Og
    -ggdb3

;==============================================================================
; Production build
;==============================================================================
[env:production]
extends = env:esp32-c6-devkitm-1
build_type = release

build_flags = 
    ${env:esp32-c6-devkitm-1.build_flags}
    -DCONFIG_OPTIMIZATION_LEVEL_RELEASE=y
    -DCONFIG_OPTIMIZATION_ASSERTIONS_DISABLED=y
    -DCONFIG_LOG_DEFAULT_LEVEL=WARN
    -DCONFIG_LOG_MAXIMUM_LEVEL=4
    -DCONFIG_COMPILER_OPTIMIZATION_SIZE=y
    -DCONFIG_ESP_SYSTEM_PANIC_PRINT_HALT=y
    -DNDEBUG

;==============================================================================
; Monitor only
;==============================================================================
[env:monitor]
extends = env:esp32-c6-devkitm-1
monitor_port = COM3
monitor_speed = 115200
monitor_filters = colorize,time